[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-instance-set-selection"
version = "0.1.0"
description = "Reproducible implementation of structured candidate-set selection for surgical instrument instance segmentation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Ze Zhang"},
  {name = "Yang Zhang"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
structured-instance-demo = "structured_instance_selection.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
